[project]
name = "wings"
version = "0.1.0"
description = "Multi-agent AI-assisted software engineering environment (Coding with AI, HSG, WS 2026)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pypdf>=4.0",  # text from uploaded PDF documents
    "pytest>=8.3",  # P5 runs the generated tests
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "mcp>=2.3,<3"]
mcp = ["mcp>=2.3,<3"]  # the Wings MCP server (wings-mcp)

[project.scripts]
wings = "wings.cli:main"
wings-mcp = "wings.mcp_server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["prompts/*.md", "*.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
