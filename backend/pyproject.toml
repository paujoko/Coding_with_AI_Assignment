[project]
name = "wings"
version = "0.1.0"
description = "Multi-agent AI-assisted software engineering environment (Coding with AI, HSG, WS 2026)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
wings = "wings.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["prompts/*.md", "*.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
